<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Book Library</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Books">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Book Reader for Telegram Mini Apps.
   Library list -> full-screen reader, one PDF page per swipe, double-tap zoom, portrait only. */
:root {
  --ink: #0d0f14;
  --card: #171b24;
  --line: rgba(255,255,255,.10);
  --glass: rgba(22,26,34,.78);
  --fg: #eef1f6;
  --muted: #98a1b0;
  --accent: #5b8cff;
  --top: env(safe-area-inset-top, 0px);      /* replaced from Telegram safe areas in script */
  --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--ink); color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Armenian", sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }

/* ---------- library ---------- */
#library {
  /* 40px wider than the screen: iPhone draws its scroll indicator in that hidden strip */
  position: fixed; top: 0; bottom: 0; left: 0; right: -40px; overflow-y: auto; overflow-x: hidden;
  padding: calc(var(--top) + 20px) calc(max(16px, env(safe-area-inset-right, 0px)) + 40px) calc(var(--bottom) + 24px) max(16px, env(safe-area-inset-left, 0px));
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;            /* hide the scroll bar (Firefox) */
  -ms-overflow-style: none;
}
#library::-webkit-scrollbar { display: none; width: 0; height: 0; }   /* hide it (Chrome, Safari, Telegram) */
#library h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.01em; }
#library .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
#list {
  display: grid; gap: 18px 14px;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
}
.book {
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
  width: 100%; padding: 0; text-align: left; color: inherit; font: inherit;
  background: none; border: 0; cursor: pointer;
}
.book:active .cover { transform: scale(.97); }
.book:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 10px; }
.cover {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4;
  border-radius: 6px 10px 10px 6px; overflow: hidden;
  display: grid; place-items: center;
  font-weight: 700; font-size: 34px; color: rgba(255,255,255,.92);
  box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 5px 0 0 rgba(0,0,0,.18);
  transition: transform .15s ease;
}
.cover img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: top center;
  background: #fff; opacity: 0; transition: opacity .3s ease;
}
.cover img.on { opacity: 1; }
.cover::after {           /* spine shading over the page image */
  content: ""; position: absolute; inset: 0 auto 0 0; width: 7px;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0));
}
.book .t { font-weight: 650; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.book .a { color: var(--muted); font-size: 12px; margin-top: -4px; }
.empty { color: var(--muted); padding: 24px 0; }
.lib-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.lib-head h1 { min-width: 0; }
.search {
  position: relative; display: flex; align-items: center; margin: 0 0 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
}
.search:focus-within { border-color: var(--accent); }
.search .mag { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
#search {
  flex: 1; min-width: 0; height: 44px; padding: 0 40px 0 40px;
  font: 16px system-ui, -apple-system, "Noto Sans Armenian", sans-serif;   /* 16px stops iPhone zooming in */
  color: var(--fg); background: transparent; border: 0; outline: none;
  -webkit-appearance: none; appearance: none;
  -webkit-user-select: text; user-select: text;
}
#search::placeholder { color: var(--muted); }
#search::-webkit-search-cancel-button { display: none; }
#searchClear {
  position: absolute; right: 6px; width: 32px; height: 32px; display: grid; place-items: center;
  border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
}
#more { display: flex; justify-content: center; gap: 6px; padding: 24px 0 8px; }
#more .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; animation: blink 1s infinite ease-in-out; }
#more .dot:nth-child(2) { animation-delay: .15s; }
#more .dot:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #more .dot { animation: none; } }
.lib-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; }
#library .lib-tools .sub { margin: 0; }
.view-toggle { display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.view-toggle button {
  display: grid; place-items: center; width: 36px; height: 30px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.view-toggle button[aria-pressed="true"] { background: rgba(91,140,255,.18); color: var(--accent); }
.view-toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* list view */
#list.as-list { grid-template-columns: 1fr; gap: 10px; }
#list.as-list .book {
  display: grid; grid-template-columns: 52px 1fr; column-gap: 14px; row-gap: 3px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
}
#list.as-list .cover {
  grid-row: 1 / span 2; width: 52px; font-size: 18px; border-radius: 3px 6px 6px 3px;
  box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 3px 0 0 rgba(0,0,0,.18);
}
#list.as-list .cover::after { width: 4px; }
#list.as-list .t { align-self: end; font-size: 15px; }
#list.as-list .a { align-self: start; margin-top: 0; }
#list.as-list .book > .t:last-child { grid-row: 1 / span 2; align-self: center; }
#homeBtn {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  font: 600 13px system-ui, -apple-system, sans-serif; color: #fff;
  background: var(--accent); border: 0; border-radius: 999px;
  padding: 9px 13px; margin-top: 2px; cursor: pointer;
}
#homeBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#sheetBack {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55);
  display: flex; align-items: flex-end; justify-content: center;
}
#sheet {
  width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 20px 20px 0 0;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(var(--bottom) + 18px) max(18px, env(safe-area-inset-left, 0px));
  animation: sheetUp .22s ease;
}
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
#sheet h2 { margin: 0 0 4px; font-size: 19px; }
#sheet .lead { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
#sheet ol { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 12px; }
#sheet li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; font-size: 15px; }
#sheet li .n {
  width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center;
  background: rgba(91,140,255,.18); color: var(--accent); font-weight: 700; font-size: 14px;
}
#sheet li svg { vertical-align: -4px; margin: 0 2px; }
#sheet .note { margin: -6px 0 16px; color: var(--muted); font-size: 13px; }
#sheet .row { display: flex; gap: 10px; }
#sheet button {
  flex: 1; font: 600 15px system-ui, -apple-system, sans-serif; border-radius: 12px; padding: 13px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
#sheet button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#sheet .urlbox {
  display: block; margin: 0 0 16px; padding: 10px 12px; border-radius: 10px;
  background: var(--ink); border: 1px solid var(--line); font-size: 13px; color: var(--fg);
  overflow-wrap: anywhere; -webkit-user-select: all; user-select: all;
}
#sheet .opts { display: grid; gap: 10px; margin: 0 0 16px; }
#sheet .opt {
  display: grid; grid-template-columns: 44px 1fr 16px; align-items: center; gap: 14px;
  width: 100%; text-align: left; text-decoration: none; color: var(--fg);
  background: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  font: inherit; cursor: pointer;
}
#sheet .opt:active { transform: scale(.985); }
#sheet .opt .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
#sheet .opt b { display: block; font-size: 16px; }
#sheet .opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.35; }
#sheet .opt .chev { color: var(--muted); }
#sheet .copy { margin: -8px 0 16px; width: auto; flex: none; padding: 9px 14px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { #sheet { animation: none; } }

/* ---------- reader ---------- */
#reader { position: fixed; inset: 0; background: var(--ink); overflow: hidden; }
#feed {
  /* 40px wider than the screen, with that strip as padding: the scroll indicator lands off-screen */
  position: absolute; top: 0; bottom: 0; left: 0; right: -40px; padding-right: 40px;
  overflow-y: scroll; overflow-x: hidden;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
  touch-action: pan-y;
}
#feed::-webkit-scrollbar { display: none; width: 0; height: 0; }
.slide {
  height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: grid; place-items: center;
  padding: var(--top) env(safe-area-inset-right, 0px) var(--bottom) env(safe-area-inset-left, 0px);
}
.page { position: relative; background: #fff; overflow: hidden; }
.page canvas { display: block; width: 100%; height: 100%; }
.page .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #8a909c; font-size: 13px; background: #f2f3f6; }

#bar {
  position: absolute; inset: 0 0 auto; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--top) + 8px) max(14px, env(safe-area-inset-right, 0px)) 18px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(13,15,20,.92) 45%, transparent);
  transition: opacity .25s ease, transform .25s ease;
}
#bar .name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill {
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  padding: 6px 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
}
.pill b { color: var(--fg); }
#backBtn {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px;
  color: var(--fg); background: var(--glass); border: 1px solid var(--line); cursor: pointer;
}
body.calm #bar { opacity: 0; transform: translateY(-100%); pointer-events: none; }

#rail {
  position: absolute; z-index: 4; width: 3px; border-radius: 3px; background: var(--line);
  right: calc(env(safe-area-inset-right, 0px) + 4px);
  top: calc(var(--top) + 12px); bottom: calc(var(--bottom) + 12px);
  pointer-events: none; transition: opacity .25s ease;
}
#railFill { position: absolute; left: 0; right: 0; top: 0; border-radius: 3px; background: var(--accent); transition: top .25s ease, height .25s ease; }
body.calm #rail { opacity: .35; }

#hint {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--bottom) + 32px);
  font-size: 13px; padding: 9px 14px; border-radius: 999px; white-space: nowrap;
  background: var(--glass); border: 1px solid var(--line); pointer-events: none;
  transition: opacity .4s ease;
}
#hint.gone { opacity: 0; }

#loading {
  position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
  color: var(--muted); font-size: 14px; pointer-events: none;
}
.bar-track { width: 160px; height: 3px; margin-top: 10px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }

/* ---------- zoom ---------- */
#zoom {
  position: fixed; top: 0; left: 0; right: -40px; bottom: -40px; z-index: 8; background: #10131a;
  overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
  scrollbar-width: none;
}
#zoom::-webkit-scrollbar { display: none; width: 0; height: 0; }
#zoom.on { opacity: 1; pointer-events: auto; }
#zoomInner canvas { display: block; background: #fff; }
#zoomTag {
  position: fixed; z-index: 9; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--bottom) + 20px);
  font-size: 12px; padding: 7px 12px; border-radius: 999px; white-space: nowrap;
  background: var(--glass); border: 1px solid var(--line); pointer-events: none;
}

/* ---------- portrait only ---------- */
#rotate { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; text-align: center; background: var(--ink); padding: 24px; }
#rotate p { margin: 12px 0 4px; font-size: 16px; font-weight: 700; }
#rotate small { color: var(--muted); }
@media (orientation: landscape) and (max-height: 540px) { #rotate { display: grid; } }

#toast {
  position: fixed; z-index: 40; left: 16px; right: 16px; top: calc(var(--top) + 60px);
  background: #3a1820; color: #ffd7de; border: 1px solid #6b2a37; border-radius: 12px; padding: 12px 14px; font-size: 14px;
}
@media (prefers-reduced-motion: reduce) { #bar, #rail, #railFill, #hint, #zoom { transition: none; } }
</style>
</head>
<body>

<main id="library">
  <div class="lib-head">
    <h1 id="libTitle">Library</h1>
    <button id="homeBtn" type="button" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Get app
    </button>
  </div>
  <div class="search">
    <svg class="mag" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search books" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search books">
    <button type="button" id="searchClear" aria-label="Clear search" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lib-tools">
    <p class="sub" id="libSub">Loading books…</p>
    <div class="view-toggle" role="group" aria-label="Library view">
      <button type="button" id="viewGrid" aria-label="Grid view" aria-pressed="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button type="button" id="viewList" aria-label="List view" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><rect x="3.5" y="4.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><rect x="3.5" y="10.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><rect x="3.5" y="16.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>
  <div id="list"></div>
  <div class="empty" id="noMatch" hidden></div>
  <div id="more" hidden>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</main>

<section id="reader" hidden>
  <div id="feed" aria-label="Book pages"></div>
  <header id="bar">
    <button id="backBtn" type="button" aria-label="Back to library" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="name" id="bookName"></div>
    <div class="pill"><b id="cur">1</b> / <span id="tot">–</span></div>
  </header>
  <div id="rail" hidden><div id="railFill"></div></div>
  <div id="hint">Swipe up · tap for menu · double-tap to zoom</div>
  <div id="loading"><div>
    <div id="loadText">Opening book…</div>
    <div class="bar-track"><div class="bar-fill" id="loadFill"></div></div>
  </div></div>
</section>

<div id="zoom"><div id="zoomInner"></div></div>
<div id="zoomTag" hidden>Drag to move · double-tap to zoom out</div>

<div id="rotate"><div>
  <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  <p>Turn your phone upright</p>
  <small>Books open in portrait mode only.</small>
</div></div>

<div id="toast" hidden></div>

<div id="sheetBack" hidden>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Add Books to your Home Screen</h2>
    <p class="lead" id="sheetLead">It opens full screen, like a normal app.</p>
    <div id="sheetBody"></div>
    <div class="row" id="sheetRow">
      <button type="button" id="sheetClose" class="primary">Got it</button>
    </div>
  </div>
</div>

<script src="lib/pdf.min.js"></script>
<script>
(function () {
  'use strict';

  /* ======================= settings ======================= */
  var LIBRARY_TITLE = 'Library';          // heading on the book list
  var TELEGRAM_LINK = 'https://t.me/SwipeBooks_bot/read';   // your bot's Mini App link
  var PER_PAGE = 30;                       // books added each time you scroll to the bottom
  var ZOOM = 2.5;                          // double-tap zoom factor
  var MAX_PIXELS = 12e6;                   // canvas size limit for phones
  var COLORS = ['#2E5BFF', '#E0457B', '#13A88A', '#F2A20C', '#7B4DE0', '#0EA5C6', '#D9534F'];

  /* ======================= Telegram ======================= */
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData);
  function tgAtLeast(v) { try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; } }

  function applyInsets() {
    var root = document.documentElement.style;
    if (inTelegram && tgAtLeast('8.0')) {
      var s = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {};
      root.setProperty('--top', ((s.top || 0) + (c.top || 0)) + 'px');
      root.setProperty('--bottom', ((s.bottom || 0) + (c.bottom || 0)) + 'px');
    }
  }

  if (tg) {
    try { tg.ready(); } catch (e) {}
    if (inTelegram) {
      try { tg.expand(); } catch (e) {}
      try { if (tgAtLeast('6.1')) { tg.setHeaderColor('#0d0f14'); tg.setBackgroundColor('#0d0f14'); } } catch (e) {}
      try { if (tgAtLeast('7.10')) tg.setBottomBarColor('#0d0f14'); } catch (e) {}
      try { if (tgAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}   // swipes turn pages instead of closing the app
      try { if (tgAtLeast('8.0')) { tg.requestFullscreen(); tg.lockOrientation(); } } catch (e) {}
      try {
        tg.onEvent('safeAreaChanged', applyInsets);
        tg.onEvent('contentSafeAreaChanged', applyInsets);
        tg.onEvent('fullscreenChanged', applyInsets);
      } catch (e) {}
      applyInsets();
    }
  }

  /* last page per book: Telegram cloud storage, else this device */
  function savePage(id, page) {
    var key = 'page_' + id;
    try { if (inTelegram && tgAtLeast('6.9')) { tg.CloudStorage.setItem(key, String(page)); return; } } catch (e) {}
    try { localStorage.setItem(key, String(page)); } catch (e) {}
  }
  function loadPage(id) {
    var key = 'page_' + id;
    return new Promise(function (resolve) {
      try {
        if (inTelegram && tgAtLeast('6.9')) {
          tg.CloudStorage.getItem(key, function (err, v) { resolve(parseInt(v, 10) || 1); });
          setTimeout(function () { resolve(1); }, 1500);
          return;
        }
      } catch (e) {}
      try { resolve(parseInt(localStorage.getItem(key), 10) || 1); } catch (e) { resolve(1); }
    });
  }

  /* ======================= elements ======================= */
  function $(id) { return document.getElementById(id); }
  var library = $('library'), list = $('list'), libSub = $('libSub');
  var reader = $('reader'), feed = $('feed'), bookName = $('bookName');
  var curEl = $('cur'), totEl = $('tot'), railFill = $('railFill'), hint = $('hint');
  var loading = $('loading'), loadText = $('loadText'), loadFill = $('loadFill');
  var zoom = $('zoom'), zoomInner = $('zoomInner'), zoomTag = $('zoomTag');
  var backBtn = $('backBtn'), toast = $('toast');

    if (!inTelegram || tgShortcut) {
      html += (inTelegram ? '<button type="button" class="opt" id="optTg">' : '<a class="opt" id="optTg" href="' + TELEGRAM_LINK + '">') +
        ICON_TG + '<span><b>' + tgTitle + '</b><small>' + tgText + '</small></span>' + CHEV +
        (inTelegram ? '</button>' : '</a>');
    }
    html += '<button type="button" class="opt" id="optHome">' + ICON_PHONE +
      '<span><b>Add to Home Screen</b><small>A separate app. Opens full screen, no Telegram needed.</small></span>' + CHEV + '</button>';
    html += '</div>';
    sheetBody.innerHTML = html;
    buttons([{ label: 'Cancel', onClick: closeSheet }]);

    var optTg = $('optTg');
    if (optTg && inTelegram) optTg.addEventListener('click', function () { closeSheet(); try { tg.addToHomeScreen(); } catch (e) {} });
    $('optHome').addEventListener('click', chooseHomeScreen);
    sheetBack.hidden = false;
  }

  /* screen 2: Add to Home Screen as a separate app */
  function chooseHomeScreen() {
    if (!inTelegram && installPrompt) {          // Android Chrome, Edge, Samsung Internet: one-tap install
      var ev = installPrompt; installPrompt = null;
      closeSheet();
      ev.prompt();
      ev.userChoice.then(function (r) { if (r.outcome === 'accepted') homeBtn.hidden = true; }).catch(function () {});
      return;
    }
    sheetTitle.textContent = 'Add to Home Screen';
    var html, list = [{ label: 'Back', onClick: showChoices }];
    var browser = ios ? 'Safari' : 'Chrome';

    if (inTelegram || inAppBrowser) {
      // a separate app can only be added from the phone's own browser
      sheetLead.textContent = 'The separate app is added from ' + browser + ', not from inside ' + (inTelegram ? 'Telegram' : 'this app') + '.';
      html = steps([
        'Copy the address below.',
        'Open <b>' + browser + '</b> and paste it.',
        'Tap <b>Get app</b> there, then <b>Add to Home Screen</b>.'
      ]) + '<span class="urlbox">' + SITE_URL + '</span>' +
        '<div class="row"><button type="button" class="copy" id="copyBtn">Copy address</button></div>';
      if (inTelegram) list.push({ label: 'Open in browser', primary: true, onClick: function () {
        try { tg.openLink(SITE_URL); } catch (e) { location.href = SITE_URL; }
      } });
      else list.push({ label: 'Got it', primary: true, onClick: closeSheet });
    } else if (ios) {
      sheetLead.textContent = 'Apple doesn’t let websites do this by themselves, so it takes 3 taps:';
      html = steps([
        'Tap ' + ICON_SHARE + ' <b>Share</b> in Safari’s toolbar.',
        'Scroll down and tap ' + ICON_ADD + ' <b>Add to Home Screen</b>.',
        'Tap <b>Add</b>. The Books icon appears on your Home Screen.'
      ]) + '<p class="note">Don’t see Share? Tap ' + ICON_DOTS_H + ' first; newer iPhones keep Share in that menu.</p>';
      list.push({ label: 'Got it', primary: true, onClick: closeSheet });
    } else {
      sheetLead.textContent = 'Your browser needs 2 taps:';
      html = steps([
        'Tap ' + ICON_DOTS_V + ' the browser menu (top right).',
        'Tap <b>Install app</b> or <b>Add to Home screen</b>, then <b>Install</b>.'
      ]) + '<p class="note">If the menu has neither, open this page in Chrome.</p>';
      list.push({ label: 'Got it', primary: true, onClick: closeSheet });
    }
    sheetBody.innerHTML = html;
    buttons(list);
    var copyBtn = $('copyBtn');
    if (copyBtn) copyBtn.addEventListener('click', function () { copyAddress(copyBtn); });
  }

  // show the Get app button (not when already running as the installed app)
  if (!standalone) {
    homeBtn.hidden = false;
    homeBtn.addEventListener('click', showChoices);
  }
  if (inTelegram && tgAtLeast('8.0') && tg.addToHomeScreen) {
    try {
      tg.checkHomeScreenStatus(function (status) { tgShortcut = (status !== 'added' && status !== 'unsupported'); });
      tg.onEvent('homeScreenAdded', function () { tgShortcut = false; });
    } catch (e) {}
  }
  window.addEventListener('appinstalled', function () { homeBtn.hidden = true; closeSheet(); });

  // service worker: needed for the Android one-tap install (not used inside Telegram)
  if (!inTelegram && 'serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  /* ======================= start ======================= */
  // Which book? Telegram link: t.me/YourBot/read?startapp=<id>   Browser test: index.html?book=<id>
  var wanted = '';
  try { wanted = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''; } catch (e) {}
  if (!wanted) { try { wanted = new URLSearchParams(location.search).get('book') || new URLSearchParams(location.search).get('tgWebAppStartParam') || ''; } catch (e) {} }

  fetchBooks().then(function () {
    renderLibrary();
    if (wanted) {
      var b = books.filter(function (x) { return x.id === wanted; })[0];
      if (b) openBook(b, false);
      else showToast('The book "' + wanted + '" is not in books.json. Showing the library instead.');
    }
  }).catch(function () {
    libSub.textContent = 'Could not load books.json. Check that the file is uploaded and has no typing mistakes (commas, quotes).';
  });
})();
</script>
</body>
</html>
